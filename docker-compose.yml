# Local Development / Evaluation Stack (D3, D4, D5, A6, A7)
# Run all services:   docker compose up --build
# Scale agent workers: docker compose up --build --scale worker=3
# Build / update the policy index (D3, inside a container, incremental):
#   docker compose run --rm indexer
#
# Ports:
#   8000  - Claim Ingestion API & Web UI (http://localhost:8000)
#   3000  - Grafana Observability Dashboard (http://localhost:3000; password from secrets/grafana_admin_password.txt)
#   9090  - Prometheus Metrics (http://localhost:9090)
#   16686 - Jaeger Tracing UI (http://localhost:16686)

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      STORE_BACKEND: redis
      QUEUE_BACKEND: rq
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ""
      CORS_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.rq_worker"]
    env_file:
      - path: .env
        required: false
    secrets:
      - llm_api_key
    environment:
      STORE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      LLM_API_KEY: ""
      CORPUS_BACKEND: ${CORPUS_BACKEND:-auto}
      CORPUS_INDEX_DIR: /srv/index
      HF_HOME: /models
      RUNS_DIR: /srv/runs
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - runs:/srv/runs
      - ./index:/srv/index:ro
      - models:/models
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      # the worker's metrics server lives in the same parent process that runs the RQ loop
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9101/metrics', timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5m

  # One-shot job, not started by `docker compose up` (profile "tools"). Parses data/policies, re-embeds only
  # changed documents and writes index/ (FAISS + chunks + manifest.json), so indexing also runs in a container.
  indexer:
    build: .
    profiles: ["tools"]
    command: ["python", "corpus.py", "index"]
    environment:
      HF_HOME: /models
    volumes:
      - ./data/policies:/srv/data/policies:ro
      - ./index:/srv/index
      - models:/models

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"  # Web UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC receiver
      - "127.0.0.1:4318:4318"    # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/dashboards/json:/etc/grafana/provisioning/dashboards/json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  runs:
  models:

secrets:
  llm_api_key:
    file: ./secrets/llm_api_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
